
project:
  name: agency-revenue-intelligence
  storage_timezone: UTC
  reporting_timezone: Asia/Kolkata
  currency: INR

forecasting:
  agency_revenue:
    target: recognized_agency_revenue
    frequency: monthly
    horizons: [1, 3]
    grain: calendar_month

  campaign_revenue:
    target: attributed_campaign_revenue
    frequency: daily
    horizons: [7, 30]
    grain: campaign_day

evaluation:
  chronological_split: true
  metrics:
    - mae
    - rmse
    - wape
    - forecast_bias

data:
  synthetic_records_must_be_labelled: true
  prevent_future_data_leakage: true
  storage_format: parquet
