name: Customer Retention Project CI

on:
  pull_request:
    paths:
      - "01-machine-learning/customer-retention-revenue-intelligence/**"
      - ".github/workflows/customer-retention-ci.yml"
  push:
    branches:
      - feature/customer-churn-prediction
    paths:
      - "01-machine-learning/customer-retention-revenue-intelligence/**"
      - ".github/workflows/customer-retention-ci.yml"

permissions:
  contents: read

jobs:
  tests:
    name: Unit tests and syntax validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 01-machine-learning/customer-retention-revenue-intelligence
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: 01-machine-learning/customer-retention-revenue-intelligence/requirements.txt
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pandas numpy duckdb pytest
      - name: Compile project modules
        run: python -m py_compile app.py src/*.py tests/*.py
      - name: Run unit tests
        run: python -m pytest -q
